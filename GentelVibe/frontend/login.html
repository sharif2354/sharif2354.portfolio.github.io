<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GentleVibe - Sign In</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        .auth-wrap {
            max-width: 440px;
            margin: 60px auto;
            padding: 35px 30px;
            border: 1px solid #cce7d0;
            border-radius: 10px;
            background: #ffffff;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
        }
        .auth-wrap h2 {
            font-size: 28px;
            color: #088178;
            margin-bottom: 8px;
            text-align: center;
        }
        .auth-wrap p {
            text-align: center;
            font-size: 14px;
            color: #666;
            margin: 0 0 25px 0;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #dcdcdc;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }
        .form-group input:focus {
            border-color: #088178;
        }
        .auth-btn {
            width: 100%;
            background-color: #088178;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }
        .auth-btn:hover {
            background-color: #06655e;
        }
        .auth-footer {
            margin-top: 20px;
            text-align: center;
            font-size: 13px;
            color: #555;
        }
        .auth-footer a {
            color: #088178;
            font-weight: 700;
        }
        #alert-box {
            padding: 10px;
            border-radius: 4px;
            font-size: 13px;
            display: none;
            margin-bottom: 15px;
            text-align: center;
        }
        .alert-error {
            background: #ffe3e3;
            color: #d63031;
            border: 1px solid #fab1a0;
        }
        .alert-success {
            background: #e8f8f5;
            color: #088178;
            border: 1px solid #a3e4d7;
        }
    </style>
</head>
<body>

    <header id="header">
        <a href="index.html" class="logo-text">GentleVibe</a>
        <nav>
            <ul id="navbar">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li id="lg-bag"><a href="cart.html"><i class="fa-solid fa-bag-shopping"></i><span id="cart-count">0</span></a></li>
            </ul>
        </nav>
    </header>

    <div class="auth-wrap">
        <h2>Welcome Back</h2>
        <p>Sign in to your GentleVibe account</p>

        <div id="alert-box"></div>

        <form id="login-form">
            <div class="form-group">
                <label for="login-email">Email Address</label>
                <input type="email" id="login-email" placeholder="sharif@example.com" required>
            </div>
            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="auth-btn">Sign In</button>
        </form>

        <div class="auth-footer">
            Don't have an account yet? <a href="signup.html">Create one here</a>
        </div>
    </div>

    <footer class="section-p1">
        <div class="col">
            <a href="index.html" class="logo-text">GentleVibe</a>
            <p><strong>Address: </strong> Green University of Bangladesh, Dhaka</p>
            <p><strong>Phone: </strong> +880 1889604070</p>
        </div>
        <div class="copyright">
            <p>© 2026 GentleVibe — Developed by Md. Sharif Hosen</p>
        </div>
    </footer>

    <script>
        const form = document.getElementById('login-form');
        const alertBox = document.getElementById('alert-box');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            alertBox.style.display = 'none';

            try {
                const res = await fetch('http://localhost:8000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.detail || 'Login failed');
                }

                localStorage.setItem('gv_user', JSON.stringify(data.user));
                if (data.token) localStorage.setItem('gv_token', data.token);

                alertBox.className = 'alert-success';
                alertBox.innerText = `Welcome back, ${data.user.fullName}! Redirecting...`;
                alertBox.style.display = 'block';

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);

            } catch (err) {
                alertBox.className = 'alert-error';
                alertBox.innerText = err.message;
                alertBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
