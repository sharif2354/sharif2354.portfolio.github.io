<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Task Hub</title>
  <style>
    /* High-contrast modern dark palette */
    :root {
      --bg: #090d16;
      --card-bg: rgba(23, 32, 54, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --input-bg: #0d1527;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      
      --accent-gradient: linear-gradient(135deg, #6366f1, #8b5cf6);
      --accent-hover: linear-gradient(135deg, #4f46e5, #7c3aed);
      
      --priority-high: #f43f5e;
      --priority-med: #f59e0b;
      --priority-low: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 10% 20%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 90% 80%, rgba(139, 92, 246, 0.12) 0px, transparent 50%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 60px 16px;
    }

    .app-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      width: 100%;
      max-width: 540px;
      border-radius: 20px;
      padding: 32px;
      border: 1px solid var(--card-border);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .counter-badge {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
    }

    /* Progress bar */
    .progress-track {
      background: rgba(255, 255, 255, 0.07);
      border-radius: 999px;
      height: 6px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent-gradient);
      transition: width 0.35s ease;
    }

    /* Input area */
    .input-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .task-input {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--text-main);
      padding: 14px 16px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .task-input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }

    .action-row {
      display: flex;
      gap: 10px;
    }

    select {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      cursor: pointer;
    }

    select option {
      background: #0d1527;
      color: var(--text-main);
    }

    .btn-submit {
      flex: 1;
      background: var(--accent-gradient);
      border: none;
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.2s;
    }

    .btn-submit:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    /* Filters */
    .filters {
      display: flex;
      gap: 6px;
      margin-bottom: 18px;
      background: rgba(0, 0, 0, 0.2);
      padding: 4px;
      border-radius: 10px;
    }

    .filter-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      padding: 8px 0;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn.active {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
    }

    /* Tasks list */
    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(13, 21, 39, 0.8);
      border: 1px solid var(--card-border);
      padding: 14px 16px;
      border-radius: 12px;
      transition: all 0.2s ease;
    }

    .task-item:hover {
      border-color: rgba(255, 255, 255, 0.15);
      transform: translateY(-1px);
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .task-checkbox {
      width: 18px;
      height: 18px;
      accent-color: #6366f1;
      cursor: pointer;
    }

    .task-text {
      font-size: 15px;
      color: var(--text-main);
      word-break: break-word;
    }

    .task-item.completed .task-text {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    /* Badges */
    .badge {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .badge-high { background: rgba(244, 63, 94, 0.15); color: var(--priority-high); }
    .badge-med { background: rgba(245, 158, 11, 0.15); color: var(--priority-med); }
    .badge-low { background: rgba(16, 185, 129, 0.15); color: var(--priority-low); }

    .btn-delete {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      padding: 4px;
      transition: color 0.2s;
    }

    .btn-delete:hover {
      color: var(--priority-high);
    }

    .empty-state {
      text-align: center;
      padding: 36px 0;
      color: var(--text-muted);
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="app-card">
    <header>
      <h1>Personal Tasks</h1>
      <span class="counter-badge" id="counter">0/0 Done</span>
    </header>

    <div class="progress-track">
      <div id="progress" class="progress-fill"></div>
    </div>

    <form class="input-form" id="task-form">
      <input type="text" id="task-input" class="task-input" placeholder="What would you like to achieve?" required />
      <div class="action-row">
        <select id="priority-select">
          <option value="high">🔴 High Priority</option>
          <option value="med" selected>🟡 Medium</option>
          <option value="low">🟢 Low / Quick</option>
        </select>
        <button type="submit" class="btn-submit">Add Task</button>
      </div>
    </form>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <ul class="task-list" id="task-list"></ul>
    <div class="empty-state" id="empty-state" style="display: none;">No tasks here. Add one above!</div>
  </div>

  <script>
    const STORAGE_KEY = "my_personal_todos";
    let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [
      { id: 1, text: "Complete key daily deliverable", priority: "high", completed: false },
      { id: 2, text: "45-minute gym or brisk walk", priority: "med", completed: false },
      { id: 3, text: "Tidy up workspace and desk", priority: "low", completed: true }
    ];

    let currentFilter = "all";

    const taskList = document.getElementById("task-list");
    const taskForm = document.getElementById("task-form");
    const taskInput = document.getElementById("task-input");
    const prioritySelect = document.getElementById("priority-select");
    const emptyState = document.getElementById("empty-state");
    const counter = document.getElementById("counter");
    const progress = document.getElementById("progress");
    const filterButtons = document.querySelectorAll(".filter-btn");

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      render();
    }

    function render() {
      taskList.innerHTML = "";

      const filtered = tasks.filter(t => {
        if (currentFilter === "active") return !t.completed;
        if (currentFilter === "completed") return t.completed;
        return true;
      });

      if (filtered.length === 0) {
        emptyState.style.display = "block";
      } else {
        emptyState.style.display = "none";
        filtered.forEach(task => {
          const li = document.createElement("li");
          li.className = `task-item ${task.completed ? "completed" : ""}`;

          li.innerHTML = `
            <div class="task-left">
              <input type="checkbox" class="task-checkbox" ${task.completed ? "checked" : ""} />
              <span class="badge badge-${task.priority}">${task.priority}</span>
              <span class="task-text">${task.text}</span>
            </div>
            <button class="btn-delete" title="Delete">&times;</button>
          `;

          li.querySelector(".task-checkbox").addEventListener("change", () => {
            task.completed = !task.completed;
            save();
          });

          li.querySelector(".btn-delete").addEventListener("click", () => {
            tasks = tasks.filter(t => t.id !== task.id);
            save();
          });

          taskList.appendChild(li);
        });
      }

      const total = tasks.length;
      const done = tasks.filter(t => t.completed).length;
      counter.textContent = `${done}/${total} Done`;
      progress.style.width = total === 0 ? "0%" : `${(done / total) * 100}%`;
    }

    taskForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = taskInput.value.trim();
      if (!text) return;

      tasks.unshift({
        id: Date.now(),
        text,
        priority: prioritySelect.value,
        completed: false
      });

      taskInput.value = "";
      save();
    });

    filterButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        filterButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.dataset.filter;
        render();
      });
    });

    render();
  </script>
</body>
</html>
