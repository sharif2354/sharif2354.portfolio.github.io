<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Business Card</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="business-card">
      <img
        class="profile-image"
        src="https://cdn.freecodecamp.org/curriculum/labs/flower.jpg"
        alt="Pink flower in full bloom"
      />
      <p class="full-name">Alex Rivera</p>
      <p class="designation">Frontend Engineer</p>
      <p class="company">Creative Solutions Inc.</p>
      
      <hr />
      
      <p>alex.rivera@example.com</p>
      <p>+1 (555) 019-2834</p>
      <a class="portfolio-link" href="https://example.com/portfolio">Portfolio</a>
      
      <hr />
      
      <div class="social-media">
        <h2>Connect with me</h2>
        <a href="https://twitter.com">Twitter</a>
        <a href="https://linkedin.com">LinkedIn</a>
        <a href="https://github.com">GitHub</a>
      </div>
    </div>
  </body>
</html>
