<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Developer Experience Survey</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <h1 id="title">Developer Experience Survey</h1>
      <p id="description">
        Help us improve our tools and platform by sharing your developer workflow and feedback.
      </p>
    </header>
<style>
  * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background-color: #0f172a;
  color: #f8fafc;
  padding: 2.5rem 1rem;
  line-height: 1.6;
}

.header {
  text-align: center;
  max-width: 650px;
  margin: 0 auto 2rem;
}

#title {
  font-size: 2rem;
  margin-bottom: 0.5rem;
  font-weight: 700;
  color: #38bdf8;
}

#description {
  color: #94a3b8;
  font-size: 1rem;
}

#survey-form {
  background-color: #1e293b;
  max-width: 650px;
  margin: 0 auto;
  padding: 2rem;
  border-radius: 12px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
}

.form-group {
  margin-bottom: 1.5rem;
}

label,
.group-title {
  display: block;
  font-weight: 600;
  margin-bottom: 0.5rem;
  font-size: 0.95rem;
  color: #e2e8f0;
}

input[type="text"],
input[type="email"],
input[type="number"],
select,
textarea {
  width: 100%;
  padding: 0.75rem 0.9rem;
  border: 1px solid #334155;
  border-radius: 6px;
  background-color: #0f172a;
  color: #f8fafc;
  font-size: 1rem;
  outline: none;
  transition: border-color 0.2s;
}

input[type="text"]:focus,
input[type="email"]:focus,
input[type="number"]:focus,
select:focus,
textarea:focus {
  border-color: #38bdf8;
}

.choice-label {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  font-weight: normal;
  margin-bottom: 0.5rem;
  cursor: pointer;
  color: #cbd5e1;
}

.choice-label input {
  accent-color: #38bdf8;
  width: 1rem;
  height: 1rem;
  cursor: pointer;
}

textarea {
  resize: vertical;
}

#submit {
  width: 100%;
  padding: 0.9rem;
  background-color: #0284c7;
  color: #ffffff;
  font-size: 1.05rem;
  font-weight: 600;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  transition: background-color 0.2s;
}

#submit:hover {
  background-color: #0369a1;
}
  </style>
  
    <main>
      <form id="survey-form">
        <!-- Name Field -->
        <div class="form-group">
          <label id="name-label" for="name">Full Name</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="e.g., Jane Doe"
            required
          />
        </div>

        <!-- Email Field -->
        <div class="form-group">
          <label id="email-label" for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="e.g., janedoe@example.com"
            required
          />
        </div>

        <!-- Number Field -->
        <div class="form-group">
          <label id="number-label" for="number">Years of Coding Experience (1 - 50)</label>
          <input
            type="number"
            id="number"
            name="years-experience"
            min="1"
            max="50"
            placeholder="e.g., 3"
          />
        </div>

        <!-- Dropdown Field -->
        <div class="form-group">
          <label for="dropdown">Primary Role / Specialization</label>
          <select id="dropdown" name="role">
            <option value="frontend">Frontend Developer</option>
            <option value="backend">Backend Developer</option>
            <option value="fullstack">Full Stack Developer</option>
            <option value="data-science">Data Scientist / ML Engineer</option>
            <option value="student">Student / Learner</option>
          </select>
        </div>

        <!-- Radio Buttons -->
        <div class="form-group">
          <p class="group-title">Would you recommend our learning platform to others?</p>
          <label class="choice-label">
            <input
              type="radio"
              name="recommend"
              value="definitely"
              checked
            />
            Definitely
          </label>
          <label class="choice-label">
            <input
              type="radio"
              name="recommend"
              value="maybe"
            />
            Maybe
          </label>
          <label class="choice-label">
            <input
              type="radio"
              name="recommend"
              value="not-sure"
            />
            Not sure
          </label>
        </div>

        <!-- Checkboxes -->
        <div class="form-group">
          <p class="group-title">Which topics are you most interested in? (Check all that apply)</p>
          <label class="choice-label">
            <input
              type="checkbox"
              name="interests"
              value="cloud-infrastructure"
            />
            Cloud & DevOps
          </label>
          <label class="choice-label">
            <input
              type="checkbox"
              name="interests"
              value="security-cryptography"
            />
            Web Security & Cryptography
          </label>
          <label class="choice-label">
            <input
              type="checkbox"
              name="interests"
              value="machine-learning"
            />
            Machine Learning & Deep Learning
          </label>
          <label class="choice-label">
            <input
              type="checkbox"
              name="interests"
              value="open-source"
            />
            Open Source Projects
          </label>
        </div>

        <!-- Textarea -->
        <div class="form-group">
          <label for="comments">Any suggestions or feedback for us?</label>
          <textarea
            id="comments"
            name="comments"
            rows="5"
            placeholder="Enter your feedback here..."
          ></textarea>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submit">Submit Feedback</button>
      </form>
    </main>
  </body>
</html>
