<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --danger: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      background: var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
    }
    .container { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }
    h1 { color: var(--accent); font-size: 2rem; }
    section {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.75rem;
    }
    h2 { font-size: 1.4rem; margin-bottom: 1rem; color: var(--accent); }
    .cart-box {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }
    .cart-box img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .form-group {
      margin-bottom: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    label { font-weight: 500; font-size: 0.95rem; }
    .required-star { color: var(--danger); font-weight: bold; }
    input[type="text"] {
      width: 100%;
      padding: 0.65rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #0b1120;
      color: var(--text);
      font-size: 1rem;
    }
    input:focus {
      outline: 2px solid var(--accent);
      border-color: transparent;
    }
    .help-text { font-size: 0.85rem; color: var(--text-muted); }
    input[type="submit"] {
      background: var(--accent);
      color: #0b1120;
      border: none;
      font-weight: 700;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 0.5rem;
    }
    input[type="submit"]:hover { background: var(--accent-hover); }
  </style>
</head>
<body>
  <div class="container">
    <h1>Checkout</h1>

    <section>
      <h2>Your Cart</h2>
      <div class="cart-box">
        <img src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg" alt="Rubik's cube toy puzzle">
        <p>1x Speed Cube (3x3x3)</p>
      </div>
    </section>

    <section>
      <h2>Payment Information</h2>
      <form>
        <div class="form-group">
          <label for="card-name">
            Name on Card <span class="required-star" aria-hidden="true">*</span>
          </label>
          <input type="text" id="card-name" name="card-name" required>
        </div>

        <div class="form-group">
          <label for="card-number">
            Card Number <span class="required-star" aria-hidden="true">*</span>
          </label>
          <input 
            type="text" 
            id="card-number" 
            name="card-number" 
            aria-describedby="card-number-help" 
            required
          >
          <p id="card-number-help" class="help-text">Please enter a 16-digit card number without spaces or dashes.</p>
        </div>

        <input type="submit" value="Complete Purchase">
      </form>
    </section>
  </div>
</body>
</html>
